<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UK Wind Forecast Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0b1120;
      color: #e2e8f0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    /* Sleek dark scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0b1120;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    /* Fix Recharts tooltip text colors on dark mode */
    .recharts-default-tooltip {
      background-color: #0f172a !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      border-radius: 10px !important;
      color: #f8fafc !important;
    }
    .recharts-tooltip-item,
    .recharts-tooltip-item-name,
    .recharts-tooltip-item-separator,
    .recharts-tooltip-item-value {
      color: #f8fafc !important;
    }
    .recharts-tooltip-label {
      color: #94a3b8 !important;
      font-weight: 600 !important;
    }

    /* Subtle floating bounce animation for hero scroll indicator */
    @keyframes floatBounce {
      0%, 100% {
        transform: translate(-50%, 0);
        opacity: 0.65;
      }
      50% {
        transform: translate(-50%, 8px);
        opacity: 1;
      }
    }

    /* Responsive grid symmetry for 4-column KPI cards */
    @media (max-width: 820px) {
      .grid-4-cols {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      }
    }
    @media (max-width: 480px) {
      .grid-4-cols {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</head>
<body style="margin:0; padding:0; background:#0b1120;">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
